name: Release

# Push a tag like v2.1.0 to build MiniFloatingCalendar.exe and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -r requirements.txt
          python tests/run_ci.py
      - name: Build .exe
        run: powershell -ExecutionPolicy Bypass -File .\build_exe.ps1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiniFloatingCalendar.exe
          generate_release_notes: true
